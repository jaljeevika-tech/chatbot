name: Deploy to Google Cloud App Engine

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # id-token lets the job sign in to GCP via Workload Identity Federation.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the deploy only on critical-severity advisories, so a routine
      # moderate/high finding in a transitive dep doesn't block shipping
      # unreviewed — but a critical one (RCE-class, auth bypass, etc.) does.
      # Run `npm audit` locally for the full report; this is a floor, not a
      # substitute for reviewing it periodically.
      - name: Audit dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical

      # Generate app.yaml at deploy time — it's gitignored (see .gitignore),
      # so CI must write it fresh on every run. Keep this in sync with the
      # local app.yaml a developer uses for manual `gcloud app deploy`.
      #
      # Real secrets (GEMINI_API_KEY, DATABASE_URL, FIREBASE_ADMIN_SDK_JSON,
      # ENCRYPTION_KEY, etc.) were migrated to GCP Secret Manager on
      # 2026-08-20 — lib/secretManager.js pulls them into process.env at boot,
      # so they must NOT be written here. The values below are all
      # intentionally non-secret: VITE_FIREBASE_* is Firebase's client-side
      # config (meant to be public — protected by Firebase security rules,
      # not secrecy) and the rest are internal Cloud Run service URLs.
      - name: Create app.yaml
        run: |
          cat > app.yaml << EOF
          runtime: nodejs22
          entrypoint: node server.js
          inbound_services:
            - warmup
          env_variables:
            NODE_ENV: production
            FIREBASE_PROJECT_ID: chatbot-5304f
            VITE_FIREBASE_API_KEY: AIzaSyAQYIjw4mv0tvx1nBDKyFEPEAmyvS6B1ko
            VITE_FIREBASE_AUTH_DOMAIN: chatbot-5304f.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID: chatbot-5304f
            VITE_FIREBASE_STORAGE_BUCKET: chatbot-5304f.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID: "470170238773"
            VITE_FIREBASE_APP_ID: "1:470170238773:web:be08641a854afb9494567c"
            NOTEBOOK_SERVICE_URL: "https://fieldflow-notebook-725980175357.asia-south1.run.app"
            RW_SERVICE_URL: "https://fieldflow-report-writer-725980175357.asia-south1.run.app"
            IB_FORM_BASE_URL: "https://fieldflow-individual-beneficiary-725980175357.asia-south1.run.app"
            EB_FORM_BASE_URL: "https://fieldflow-micro-entrepreneur-725980175357.asia-south1.run.app"
            CB_FORM_BASE_URL: "https://fieldflow-collective-725980175357.asia-south1.run.app"
            RS_FORM_BASE_URL: "https://fieldflow-resource-725980175357.asia-south1.run.app"
            APP_BASE_URL: "https://chatbot-492915.el.r.appspot.com"
          automatic_scaling:
            min_instances: 1
            max_instances: 3
            target_cpu_utilization: 0.65
          EOF

      # Vite bakes VITE_* into the bundle at build time, and CI has no .env —
      # without these the Firebase config is empty and the app hangs on the
      # loading screen. Reuse the values from app.yaml above (single source).
      - name: Build frontend
        run: |
          grep -E '^\s+VITE_[A-Z_]+:' app.yaml | sed -E 's/^\s+([A-Z_]+):\s*"?([^"]*)"?\s*$/\1=\2/' > .env.production.local
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Keyless: the pool only trusts jaljeevika-tech/chatbot. No secrets needed.
          workload_identity_provider: projects/725980175357/locations/global/workloadIdentityPools/github/providers/chatbot
          service_account: github-deployer@chatbot-492915.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: chatbot-492915

      - name: Deploy to App Engine
        run: gcloud app deploy app.yaml --quiet --version=main
          # Roll the Cloud Run services onto this commit's code so they never drift from the
  # main app. Runs after App Engine: the new notebook/report-writer images refuse the
  # old main app's unkeyed calls, while the new main app falls back to running them itself.
  # Only the image changes; each service's settings and secrets are left as they are.
  cloud-run:
    name: Cloud Run (${{ matrix.service }})
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notebook, report-writer, individual-beneficiary, micro-entrepreneur, collective, resource]
    env:
      IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/fieldflow-${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Build and push image
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build -f services/${{ matrix.service }}/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: gcloud run deploy fieldflow-${{ matrix.service }} --image "$IMAGE" --region asia-south1 --quiet
